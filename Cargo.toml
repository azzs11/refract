[workspace]
resolver = "3"
members = [
    "crates/refract-core",
    "crates/refract-cli",
    "crates/refract-oracle",
    "crates/refract-wasm",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/azzs11/refract"
keywords = ["regex", "automata", "equivalence", "redos", "portability"]
categories = ["text-processing", "development-tools", "command-line-utilities"]
rust-version = "1.89"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.test]
opt-level = 2

# Small, fast WASM for the web app.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
