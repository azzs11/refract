[package]
name = "refract-wasm"
description = "WebAssembly bindings of refract-core for the web app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
refract-core = { package = "refract-regex", version = "0.5.0", path = "../refract-core" }
serde_json = "1.0.154"
# Must equal the wasm-bindgen CLI version used by web/scripts/build-wasm.sh.
wasm-bindgen = "=0.2.130"
