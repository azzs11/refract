[package]
name = "refract-regex"
description = "One regex across JavaScript, Python, Go, Java and Rust: flavour parsers, symbolic automata, equivalence with shortest witnesses, ReDoS prediction and verified translation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[lib]
# The directory and the workspace keep the name refract-core; crates.io has `refract-regex`.
name = "refract_regex"

[lints]
workspace = true

[dependencies]
regex-syntax = "0.8.12"
thiserror = "2.0.21"
# std::time::Instant panics on wasm32-unknown-unknown; web-time re-exports std elsewhere.
web-time = "1.1.0"

[dev-dependencies]
proptest = "1.12.0"
refract-oracle = { path = "../refract-oracle" }
regex = "1.13.2"
