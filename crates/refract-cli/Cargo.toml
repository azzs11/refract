[package]
name = "refract-cli"
description = "refract: see where one regex means something else in JavaScript, Python, Go, Java and Rust, with the shortest witness, confirmed on the real engines"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[[bin]]
name = "refract"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
refract-core = { package = "refract-regex", version = "0.5.0", path = "../refract-core" }
refract-oracle = { version = "0.5.0", path = "../refract-oracle" }
regex = "1.13.2"
serde_json = "1.0.154"

[dev-dependencies]
insta = "1.49.0"
