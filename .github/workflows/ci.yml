name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # nightly: long property runs + fuzzing

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  msrv:
    name: MSRV 1.89
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace

  web:
    name: web app (WASM, svelte-check, Playwright + axe)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci
          npm run wasm
          npm run check
          npm run build
          npx playwright install --with-deps chromium
          PW_CHANNEL=chromium npx playwright test

  self-check:
    name: refract check on this repository (the GitHub Action)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./integrations/github-action
        with:
          source: local
          paths: web/src oracle bench
          fail-on: error
      - name: VS Code extension helpers against the CLI
        working-directory: integrations/vscode
        run: REFRACT_BIN=refract node test.js

  properties-long:
    name: long property runs (main + nightly)
    if: github.event_name != 'pull_request'
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Double construction, 1M random regexes
        run: PROPTEST_CASES=1000000 cargo test --release -p refract-core --test double_construction engines_and_minimisers_agree
      - name: Witness validity and real-engine agreement, 200k cases
        run: PROPTEST_CASES=200000 cargo test --release -p refract-core --test equiv_props --test rust_oracle --test rust_differential

  oracles:
    name: real-engine oracles (Python, JS, Go, Java)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build pinned engine images
        run: |
          for e in python node go java; do docker build -q -t refract-oracle-$e oracle/$e; done
      - name: Oracle suites (Docker engines)
        env:
          REFRACT_ORACLE: docker
        run: cargo test --release -p refract-core --test python_oracle --test js_oracle --test go_oracle --test java_oracle

  fuzz:
    name: fuzz parser (nightly, 1 h)
    if: github.event_name == 'schedule'
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cd fuzz && cargo fuzz run parse_rust -- -dict=dict/rust.dict -max_total_time=3600 -max_len=256
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
