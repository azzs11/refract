name: Release

# Push a tag like v0.5.0. Builds binaries, creates the GitHub release, deploys the web app to
# GitHub Pages (enable Pages with source "GitHub Actions" once), and publishes the crates when
# the CARGO_REGISTRY_TOKEN secret is set.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p refract-cli --target ${{ matrix.target }}
      - name: Archive
        shell: bash
        run: |
          name="refract-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "$name"/
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/${{ matrix.target }}/release/refract.exe" "$name"/
            7z a "$name.zip" "$name" >/dev/null
          else
            cp "target/${{ matrix.target }}/release/refract" "$name"/
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          # The archives only (the staging directory's name also contains dots).
          path: |
            refract-*.tar.gz
            refract-*.zip
          if-no-files-found: error

  release:
    name: GitHub release
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          (cd dist && sha256sum refract-*.tar.gz refract-*.zip > SHA256SUMS)
          # Release notes: this version's section of the changelog.
          awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/{ if (p) exit; if (index($0, "[" v "]")) p = 1 } p' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "Refract $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  web:
    name: web app → GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci && npm run wasm && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  pages:
    name: deploy Pages
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  crates:
    name: publish to crates.io
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish (skipped without a token)
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          cargo publish --locked -p refract-oracle
          cargo publish --locked -p refract-regex
          cargo publish --locked -p refract-cli
